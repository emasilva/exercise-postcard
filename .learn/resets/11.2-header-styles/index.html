<!DOCTYPE html>
<html lang="es">
	<head>
		<link rel="stylesheet" href="styles.css" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Postcard</title>
		<style>
			body {
				font-family: "Comic Sans MS", cursive, sans-serif;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				background-color: #f8f8f8;
			}
			.postcard {
				width: 400px;
                height: 300px;
                margin: auto;
				background: white;
				padding: 20px;
				border: 4px solid black;
				box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2);
			}
			.postcard h2 {
				margin: 0;
			}
			.postcard p {
				font-size: 16px;
			}
			.form {
				display: flex;
				flex-direction: column;
			}
			.form input {
				margin: 5px 0;
				padding: 5px;
				border: none;
				border-bottom: 1px solid gray;
				font-size: 14px;
				outline: none;
			}
			.send-button {
				background: gray;
				color: white;
				padding: 8px;
				border: none;
				margin-top: 10px;
				cursor: pointer;
			}
			.logo {
				float: right;
				width: 50px;
			}
		</style>
	</head>
	<body>
		<div class="postcard">
             <div class="postcard-header">
                <h1>My Postcard</h1>
                <img
                    src=" https://raw.githubusercontent.com/breatheco-de/exercise-postcard/e63a7916530cc850bd92aa1c2e19191837fb5c80/.learn/assets/4geeks.png"
                    alt="Logo"
                />
             </div>
                </div>
             <div class="postcard-body">
                </div>
             <div class="postcard-footer">

             </div>
            </div>
			
			<p>Look how awesome! This is a postcard that I created using HTML5 and CSS3 during my 4Geeks Academy Course!</p>
			<p>This is so cool, can't wait to start doing more stuff!</p>
			<div class="form">
				<input type="text" placeholder="Some Name" />
				<input type="email" placeholder="Some Email" />
				<input type="text" placeholder="Some comment" />
				<button class="send-button">Send My Postcard</button>
			</div>
		</div>
	</body>
</html>
